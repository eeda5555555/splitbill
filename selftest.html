<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>selftest</title><body style="font:16px -apple-system,sans-serif;padding:16px"><h3 id="r">running...</h3><pre id="o" style="white-space:pre-wrap"></pre>
<script src="core.js"></script><script src="vendor/tesseract.min.js"></script>
<script>
(async()=>{const r=document.getElementById('r'),o=document.getElementById('o');try{
const base=new URL('vendor/',location.href).href;
const blob=await (await fetch('selftest-receipt.jpg')).blob();
const bmp=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);
const t0=performance.now();
const w=await Tesseract.createWorker('eng+ind',1,{workerPath:base+'worker.min.js',corePath:base,langPath:base+'lang',workerBlobURL:false,cacheMethod:'none'});
await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
const {data}=await w.recognize(c);await w.terminate();
const p=SplitCore.parseReceipt(data.text,0);
const ok=p.items.length===3&&p.service===5050&&p.tax===10605&&p.total===116655;
r.textContent=(ok?'OCR PASS':'OCR FAIL')+' '+Math.round(performance.now()-t0)+'ms simd='+(typeof WebAssembly==='object');
o.textContent=JSON.stringify(p.items)+'\n\n'+data.text;
}catch(e){r.textContent='ERROR '+e;}})();
</script>
