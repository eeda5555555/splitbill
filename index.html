<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f4f5f4; --card: #ffffff; --text: #17201f; --muted: #66726f; --line: #dfe4e2;
  --accent: #0f766e; --accent-ink: #ffffff; --warn: #b45309; --warn-bg: #fef3c7; --danger: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101413; --card: #1a201f; --text: #e8eeec; --muted: #93a09c; --line: #2c3533;
    --accent: #2dd4bf; --accent-ink: #052e2a; --warn: #fbbf24; --warn-bg: #3a2a08; --danger: #f87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 40px);
}
main { max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 8px; padding: 14px 0 6px; }
header h1 { font-size: 24px; margin: 0; flex: 1; letter-spacing: -.02em; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
input, select, button { font: inherit; color: inherit; }
input[type=text], select {
  width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
button {
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); min-width: 44px; padding: 0 8px; }
button:disabled { opacity: .5; }
header select { width: auto; min-height: 36px; padding: 4px 8px; }
header button { min-height: 36px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > input[type=text] { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid var(--c, var(--line));
  background: transparent; font-size: 15px; color: var(--text);
}
.chip.on { background: var(--c); color: #fff; border-color: var(--c); }
.person { display: inline-flex; align-items: center; gap: 2px; padding-left: 12px; border-radius: 18px; background: var(--c); color: #fff; min-height: 36px; }
.person button { color: #fff; min-height: 36px; min-width: 32px; padding: 0 8px; opacity: .85; }
.item { padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 0; }
.item .price { width: 118px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-top: 10px; }
.extra { display: grid; grid-template-columns: 76px 1fr 56px; gap: 8px; align-items: center; margin-bottom: 8px; }
.extra input { text-align: right; font-variant-numeric: tabular-nums; }
.extra button { padding: 0; font-size: 14px; }
.scan { display: flex; gap: 8px; }
.scan > * { flex: 1; }
.empty { color: var(--muted); text-align: center; padding: 14px 0 6px; }
.status { font-size: 14px; color: var(--muted); margin-top: 8px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
details.pp { border-top: 1px solid var(--line); padding: 10px 0; }
details.pp:first-of-type { border-top: 0; padding-top: 0; }
summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 36px; }
summary::-webkit-details-marker { display: none; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.nm { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.big { font-size: 20px; font-weight: 700; }
.bd { padding: 6px 0 2px 22px; font-size: 14px; color: var(--muted); }
.bd div { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.bd div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum { display: flex; justify-content: space-between; padding: 10px 0 0; border-top: 2px solid var(--line); margin-top: 6px; font-weight: 700; }
.fine { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; padding-top: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Split</h1>
    <select id="cur" aria-label="Currency"></select>
    <button id="reset">New bill</button>
  </header>

  <section>
    <h2>People</h2>
    <div class="row">
      <input type="text" id="pname" placeholder="Add a name" autocapitalize="words" autocomplete="off" enterkeyhint="done">
      <button class="primary" id="padd">Add</button>
    </div>
    <div class="chips" id="people"></div>
  </section>

  <section>
    <h2>Items</h2>
    <div class="scan">
      <button class="primary" id="scan">Scan receipt</button>
      <button id="addItem">Add item</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div id="scanStatus" class="status" hidden></div>
    <div class="bar" id="scanBar" hidden><i></i></div>
    <div id="items"></div>
  </section>

  <section>
    <h2>Service, tax &amp; more</h2>
    <div id="extras"></div>
    <p class="hint">% for service and tip is of the items subtotal; tax % is of items plus service. Everything is shared in proportion to what each person ordered.</p>
  </section>

  <section id="result">
    <h2>Who pays what</h2>
    <div id="out"></div>
  </section>
</main>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
